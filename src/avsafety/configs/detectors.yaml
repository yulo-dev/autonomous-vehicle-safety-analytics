# Detector configuration. Bump `version` whenever a threshold changes: the
# detect stage refuses to reuse a version with a different config hash, so
# every stored event traces back to one exact rule set.
version: "1.0.0"

smoothing:
  window_s: 0.7       # Savitzky-Golay window
  polyorder: 2

hard_braking:
  decel_threshold_mps2: -3.0
  min_duration_s: 0.3
  min_speed_mps: 1.0  # ignore jitter at standstill
  merge_gap_s: 0.2
  severity_bins_mps2: [-4.5, -6.0]   # S1: [-4.5, -3.0)  S2: [-6.0, -4.5)  S3: < -6.0

low_ttc_conflict:
  ttc_threshold_s: 2.0
  horizon_s: 5.0
  min_duration_s: 0.3
  max_range_m: 50.0
  min_sdc_speed_mps: 1.0
  merge_gap_s: 0.5    # TTC flickers near the contact boundary; keep one episode per counterpart
  counterpart_types: [vehicle, pedestrian, cyclist]
  severity_bins_s: [1.5, 1.0]        # S1: [1.5, 2.0)  S2: [1.0, 1.5)  S3: < 1.0
