[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avsafety"
version = "0.1.0"
description = "Safety event detection, triage, and reporting on the Waymo Open Motion Dataset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "pyarrow>=14",
    "protobuf>=6.33.5,<7",  # must be >= the version that generated src/avsafety/protos
    "google-crc32c>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "grpcio-tools>=1.70",  # only needed to regenerate protos
]

[project.scripts]
avsafety = "avsafety.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
extend-exclude = ["src/avsafety/protos"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
